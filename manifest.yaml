version: 0.2.2
type: plugin
author: zhou0928
name: plan-executor-agent
label:
  en_US: Plan-Executor Agent
  ja_JP: 計画実行エージェント
  zh_Hans: 计划执行 Agent
  pt_BR: Agente Plan-Executor
description:
  en_US: "Plan-and-Execute agent strategy: generates a structured step-by-step plan first, then executes with tool awareness; automatically replans when a step fails or results deviate from the plan. Supports streaming output, parallel step execution, file input, and execution metadata reporting."
  ja_JP: "Plan-and-Execute エージェント戦略：まず構造化されたステップごとの計画を生成し、ツール認識を持って段階的に実行します。ステップの失敗や計画からの逸脱時には自動的に再プランニングし、ストリーミング出力、並列ステップ実行、ファイル入力、実行メタデータの報告をサポートします。"
  zh_Hans: "Plan-and-Execute 先规划再执行策略：先生成结构化分步计划，再带工具感知逐步执行；步骤失败或偏离计划时自动重规划，支持流式输出、并行步骤执行、文件输入与执行元数据上报"
  pt_BR: "Estratégia de agente Plan-and-Execute: primeiro gera um plano estruturado passo a passo, depois executa com percepção de ferramentas; replaneja automaticamente quando uma etapa falha ou os resultados se desviam do plano. Suporta saída em streaming, execução paralela de etapas, entrada de arquivos e relatório de metadados de execução."
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
plugins:
  agent_strategies:
    - provider/plan-executor-agent.yaml
meta:
  version: 0.2.2
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.9.0
